name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Build (darwin/amd64)
        env:
          GOOS: darwin
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" ./...
      - name: Build (darwin/arm64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" ./...
